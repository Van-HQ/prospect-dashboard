<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --surface: #111620;
    --surface2: #161d2a;
    --border: #1e2d42;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #39ff88;
    --text: #e8f0f8;
    --text-dim: #6b8099;
    --text-mid: #9ab0c8;
    --red: #ff4444;
    --gold: #ffd700;
    --purple: #b06eff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .header {
    background: linear-gradient(135deg, #0a0e14 0%, #0d1826 50%, #0a1520 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-badge { background: var(--accent); color: #000; font-family: 'Bebas Neue', cursive; font-size: 13px; letter-spacing: 2px; padding: 4px 10px; border-radius: 2px; }
  .header h1 { font-family: 'Bebas Neue', cursive; font-size: 24px; letter-spacing: 3px; }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .stat-pill { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); border: 1px solid var(--border); padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
  .stat-pill span { color: var(--accent); font-weight: 600; }
  .chip { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 11px; border-radius: 3px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

  .controls {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 260px; }
  .search-wrap input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    padding: 6px 10px 6px 28px; border-radius: 3px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }
  select, .filter-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-mid);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 6px 9px;
    border-radius: 3px; cursor: pointer; outline: none; transition: all 0.2s;
  }
  select:hover, .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  select option { background: var(--surface2); }
  .sort-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .view-btn { background: var(--surface2); border: none; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 6px 12px; cursor: pointer; transition: all 0.2s; }
  .view-btn.active { background: var(--accent); color: #000; font-weight: 600; }
  .trend-tog { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 6px 12px; border-radius: 3px; cursor: pointer; transition: all 0.2s; margin-left: 8px; }
  .trend-tog.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

  .main { padding: 16px 24px; }

  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; transition: border-color 0.2s; }
  .summary-card:hover { border-color: var(--accent); }
  .summary-card .label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 3px; }
  .summary-card .value { font-family: 'Bebas Neue', cursive; font-size: 26px; color: var(--accent); }
  .summary-card .sub { font-size: 10px; color: var(--text-dim); margin-top: 1px; }

  .table-container { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    background: var(--surface); color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 7px 8px;
    text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
    cursor: pointer; user-select: none; transition: color 0.2s;
    position: sticky; top: 0; z-index: 10;
  }
  thead th:hover { color: var(--accent); }
  thead th.sorted { color: var(--accent); }
  thead th .arr { font-size: 9px; margin-left: 2px; }
  tbody tr { border-bottom: 1px solid rgba(30,45,66,0.5); transition: background 0.1s; cursor: pointer; }
  tbody tr:hover { background: rgba(0,212,255,0.04); }
  tbody td { padding: 6px 8px; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mid); }
  .pname { color: var(--text) !important; font-weight: 600; font-family: 'IBM Plex Sans', sans-serif !important; font-size: 12px !important; }
  .tbadge { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; padding: 2px 5px; border-radius: 2px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-mid); }
  .lvl { font-size: 9px; padding: 2px 5px; border-radius: 2px; font-weight: 600; }
  .lAAA { background: rgba(255,215,0,0.12); color: var(--gold); border: 1px solid rgba(255,215,0,0.25); }
  .lAA  { background: rgba(0,212,255,0.08); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
  .lAp  { background: rgba(57,255,136,0.08); color: var(--accent3); border: 1px solid rgba(57,255,136,0.2); }
  .lA   { background: rgba(255,107,53,0.08); color: var(--accent2); border: 1px solid rgba(255,107,53,0.2); }
  .lCPX { background: rgba(176,110,255,0.08); color: var(--purple); border: 1px solid rgba(176,110,255,0.2); }
  .sh { color: var(--accent3) !important; }
  .sm { color: var(--accent) !important; }
  .sy { color: var(--gold) !important; }
  .sl { color: var(--accent2) !important; }
  .sr { color: var(--red) !important; }
  .bw { display: flex; align-items: center; gap: 5px; }
  .bar { height: 4px; background: var(--border); border-radius: 2px; width: 44px; overflow: hidden; flex-shrink: 0; }
  .bf { height: 100%; border-radius: 2px; }
  .bv { font-size: 10px; min-width: 24px; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 13px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .pcard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); opacity: 0; transition: opacity 0.2s; }
  .pcard:hover { border-color: rgba(0,212,255,0.35); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .pcard:hover::before { opacity: 1; }
  .ch { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 9px; }
  .cn { font-weight: 600; font-size: 13px; }
  .cm { font-size: 10px; color: var(--text-dim); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .sc { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', cursive; font-size: 19px; border: 2px solid; flex-shrink: 0; }
  .sc.sh { border-color: var(--accent3) !important; color: var(--accent3) !important; background: rgba(57,255,136,0.07); }
  .sc.sm { border-color: var(--accent) !important; color: var(--accent) !important; background: rgba(0,212,255,0.07); }
  .sc.sy { border-color: var(--gold) !important; color: var(--gold) !important; background: rgba(255,215,0,0.07); }
  .sc.sl { border-color: var(--accent2) !important; color: var(--accent2) !important; background: rgba(255,107,53,0.07); }
  .sc.sr { border-color: var(--red) !important; color: var(--red) !important; background: rgba(255,68,68,0.07); }
  .csg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  .cs { text-align: center; }
  .sv2 { font-family: 'Bebas Neue', cursive; font-size: 17px; }
  .sl2 { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.5px; }
  .cdiv { height: 1px; background: var(--border); margin: 7px 0; }
  .ctg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 6px; }
  .ti { text-align: center; }
  .tl { font-size: 8px; color: var(--text-dim); letter-spacing: 0.3px; text-transform: uppercase; }
  .tb { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 2px 0; }
  .tbf { height: 100%; border-radius: 2px; }
  .tv { font-family: 'IBM Plex Mono', monospace; font-size: 9px; }

  .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; backdrop-filter: blur(4px); align-items: center; justify-content: center; }
  .detail-overlay.open { display: flex; }
  .dpanel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: 92%; max-width: 660px; max-height: 90vh; overflow-y: auto; position: relative; animation: su 0.2s ease; }
  @keyframes su { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .dclose { position: absolute; top: 12px; right: 12px; background: none; border: 1px solid var(--border); color: var(--text-dim); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 10; }
  .dclose:hover { border-color: var(--red); color: var(--red); }
  .dflip { position: absolute; top: 12px; right: 46px; background: none; border: 1px solid var(--border); color: var(--text-dim); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 10; }
  .dflip:hover { border-color: var(--accent); color: var(--accent); }
  #dstar { position: absolute; top: 12px; right: 80px; background: none; border: 1px solid var(--border); color: var(--text-dim); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 15px; display: none; align-items: center; justify-content: center; transition: all 0.2s; z-index: 10; line-height:1; }
  #dstar:hover, #dstar.on { border-color: var(--gold); color: var(--gold); }
  #dscore { position: absolute; top: 46px; right: 16px; width: 52px; height: 52px; font-size: 24px; display: none; }
  .star-btn { background: none; border: none; cursor: pointer; color: var(--border); font-size: 15px; padding: 0; line-height: 1; transition: color 0.15s; }
  .star-btn:hover, .star-btn.on { color: var(--gold); }
  .star-td { width: 28px; text-align: center; }
  /* ── Sticky first 3 columns ── */
  /* tbody: needs position:sticky + opaque bg so scrolled content doesn't bleed through */
  tbody td.st { position: sticky; z-index: 2; background: var(--bg); }
  tbody tr:hover td.st { background: #0a161d; }
  /* thead: already has position:sticky+top:0 — just bump z-index above normal headers */
  thead th.st { z-index: 11; }
  /* left offsets for each column */
  .st1 { left: 0; }
  .st2 { left: 28px; min-width: 36px; width: 36px; }
  .st3 { left: 64px; box-shadow: 3px 0 8px rgba(0,0,0,0.4); }
  .watch-empty { text-align:center; padding:60px 20px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .tr-up { color:#39ff88; font-size:9px; vertical-align:middle; margin-left:2px; }
  .tr-dn { color:#ff4444; font-size:9px; vertical-align:middle; margin-left:2px; }
  .tr-neu { color:var(--gold); font-size:9px; vertical-align:middle; margin-left:2px; }
  .flip-wrap { perspective: 1200px; width: 100%; }
  .flip-inner { transform-style: preserve-3d; transition: transform 0.65s cubic-bezier(0.4,0.2,0.2,1); position: relative; }
  .flip-inner.flipped { transform: rotateY(180deg); }
  .flip-front { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); position: absolute; top: 0; left: 0; width: 100%; background: var(--surface); border-radius: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 10px 12px; }
  @keyframes radarGrow { from { opacity:0; transform:scale(0.15); } to { opacity:1; transform:scale(1); } }
  @keyframes radarFade { from { opacity:0; } to { opacity:1; } }
  .r-poly { transform-origin: 250px 250px; animation: radarGrow 0.7s cubic-bezier(0.34,1.56,0.64,1) both; }
  .r-dot  { animation: radarFade 0.5s ease both; }
  .r-grid { animation: radarFade 0.35s ease both; }
  .r-lbl  { animation: radarFade 0.6s ease both; }
  .dh { padding: 14px 22px 10px; border-bottom: 1px solid var(--border); min-height: 104px; box-sizing: border-box; }
  .dname { font-family: 'Bebas Neue', cursive; font-size: 26px; letter-spacing: 2px; }
  .dmeta { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
  .dmeta-dot { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mid); }
  .dmeta-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-mid); letter-spacing: 0.02em; }
  .dlinks { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .dlink { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); border: 1px solid var(--border); padding: 2px 8px; border-radius: 2px; text-decoration: none; transition: color 0.15s, border-color 0.15s; }
  .dlink:hover { color: var(--accent); border-color: var(--accent); }
  .db { padding: 12px 22px; }
  .ds { margin-bottom: 12px; }
  .ds h3 { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
  .dg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .dg5 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px; }
  .dstat .dl { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 1px; }
  .dstat .dv { font-family: 'Bebas Neue', cursive; font-size: 19px; }
  .dtb { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 3px 0; }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 5px; padding: 16px 0 6px; flex-wrap: wrap; }
  .pb { background: var(--surface); border: 1px solid var(--border); color: var(--text-mid); font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 9px; border-radius: 3px; cursor: pointer; transition: all 0.2s; }
  .pb:hover, .pb.active { border-color: var(--accent); color: var(--accent); }
  .pb:disabled { opacity: 0.3; cursor: default; }
  .pi { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); padding: 0 6px; }
  .empty { text-align: center; padding: 50px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Prospect Dashboard</h1>
  </div>
  <div class="header-right" id="header-right"></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="ico">⌕</span>
    <input type="text" id="search" placeholder="Search player or team...">
  </div>
  <span class="sort-label">Team:</span>
  <select id="ft">
    <option value="">All Teams</option>
    <option>ARI</option><option>ATL</option><option>BAL</option><option>BOS</option>
    <option>CHC</option><option>CHW</option><option>CIN</option><option>CLE</option>
    <option>COL</option><option>DET</option><option>HOU</option><option>KCR</option>
    <option>LAA</option><option>LAD</option><option>MIA</option><option>MIL</option>
    <option>MIN</option><option>NYM</option><option>NYY</option><option>OAK</option>
    <option>PHI</option><option>PIT</option><option>SDP</option><option>SEA</option>
    <option>SFG</option><option>STL</option><option>TBR</option><option>TEX</option>
    <option>TOR</option><option>WSN</option>
  </select>
  <span class="sort-label">Level:</span>
  <select id="fl">
    <option value="">All Levels</option>
    <option value="AAA">AAA</option>
    <option value="AA">AA</option>
    <option value="A+">A+</option>
    <option value="A">A</option>
    <option value="CPX">CPX/ROK</option>
  </select>
  <span class="sort-label">Age ≤:</span>
  <select id="fa">
    <option value="">Any</option>
    <option value="18">18</option><option value="19">19</option><option value="20">20</option>
    <option value="21">21</option><option value="22">22</option><option value="23">23</option>
    <option value="24">24</option><option value="25">25</option>
  </select>
  <span class="sort-label">Min AB:</span>
  <select id="fab">
    <option value="">Any</option>
    <option value="50">50</option><option value="75">75</option><option value="100">100</option>
    <option value="125">125</option><option value="150">150</option><option value="175">175</option>
  </select>
  <span class="sort-label">Sort:</span>
  <select id="sb">
    <optgroup label="── Rankings ──">
      <option value="ltw">LTW Score</option>
      <option value="prospect_score">Prospect Score</option>
      <option value="name">Name A-Z</option>
    </optgroup>
    <optgroup label="── Slash Line ──">
      <option value="avg">AVG</option>
      <option value="obp">OBP</option>
      <option value="slg">SLG</option>
      <option value="ops">OPS</option>
    </optgroup>
    <optgroup label="── Advanced ──">
      <option value="woba">wOBA</option>
      <option value="iso">ISO</option>
      <option value="wrc">wRC+</option>
      <option value="swstr">SwStr%</option>
    </optgroup>
    <optgroup label="── Production ──">
      <option value="ab">AB</option>
      <option value="hr">HR</option>
      <option value="sb2">SB</option>
      <option value="bb">BB%</option>
      <option value="k">K%</option>
    </optgroup>
    <optgroup label="── Tool Grades ──">
      <option value="hit">HIT</option>
      <option value="pwr">PWR</option>
      <option value="spd">SPD</option>
      <option value="dis">DIS</option>
      <option value="age_r">AGE Grade</option>
      <option value="wrc_r">wRC+ Grade</option>
    </optgroup>
    <optgroup label="── Other ──">
      <option value="age">Age</option>
    </optgroup>
  </select>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-table" onclick="setView('table')">≡ Table</button>
    <button class="view-btn" id="btn-cards" onclick="setView('cards')">⊞ Cards</button>
    <button class="view-btn" id="btn-watch" onclick="setView('watch')">★ Watchlist</button>
  </div>
  <button class="trend-tog" id="btn-trends" onclick="toggleTrends()" title="Toggle MoM trend arrows">↑↓ Trends</button>
</div>

<div class="main">
  <div id="sumbar"></div>
  <div id="tv"><div class="table-container"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></div>
  <div id="cv" style="display:none"><div class="cards-grid" id="cg"></div></div>
  <div id="wv" style="display:none"><div class="table-container"><table><thead id="wh"></thead><tbody id="wt"></tbody></table></div></div>
  <div class="pagination" id="pg"></div>
</div>

<div class="detail-overlay" id="dov" onclick="closeDov(event)">
  <div class="dpanel" id="dp">
    <button class="dclose" onclick="closeD()">✕</button>
    <button class="dflip" onclick="flipCard()" title="Radar view">⇌</button>
    <button id="dstar" onclick="toggleWatch(RAW[currentIdx],event)" title="Add to watchlist">★</button>
    <div id="dscore" class="sc"></div>
    <div id="dc"></div>
  </div>
</div>

<script>
let RAW = [];
let filtered = [];
let sortF = 'ltw', sortD = -1;
let activeProfile = null; // 'power' | 'contact' | null
let activeFallers = false;
let activeValue = false;

function flipCard() {
  const fi = document.getElementById('fi');
  const dp = document.getElementById('dp');
  fi.classList.toggle('flipped');
  if (fi.classList.contains('flipped')) {
    dp.style.overflow = 'hidden';
  } else {
    setTimeout(() => { dp.style.overflow = ''; }, 500);
  }
}

function radarSVG(p) {
  const axes = [
    {l:'HIT',  v: p.hit   ?? 0},
    {l:'DIS',  v: p.dis   ?? 0},
    {l:'PWR',  v: p.pwr   ?? 0},
    {l:'SPD',  v: p.spd   ?? 0},
    {l:'AGE',  v: p.age_r ?? 0},
    {l:'WRC+', v: p.wrc_r ?? 0}
  ];
  const n = 6, cx = 250, cy = 250, r = 175;
  const rc = p.prospect_score >= 90 ? '#00d4ff' : p.prospect_score >= 80 ? '#39ff88' : p.prospect_score >= 70 ? '#ffd700' : p.prospect_score >= 60 ? '#ff6b35' : '#ff4444';

  function pt(i, scale) {
    const a = (Math.PI * 2 * i / n) - Math.PI / 2;
    return [cx + r * scale * Math.cos(a), cy + r * scale * Math.sin(a)];
  }
  function anchor(i) {
    const c = Math.cos((Math.PI * 2 * i / n) - Math.PI / 2);
    return c > 0.2 ? 'start' : c < -0.2 ? 'end' : 'middle';
  }

  const rings = [0.25, 0.5, 0.75, 1].map((lv, ri) => {
    const pts = Array.from({length:n}, (_,i) => pt(i,lv).join(',')).join(' ');
    return `<polygon class="r-grid" style="animation-delay:${ri*0.04}s" points="${pts}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
  }).join('');

  const ringNums = [25,50,75,100].map((v,i) => {
    const [x,y] = pt(0, (i+1)*0.25);
    return `<text x="${x+5}" y="${y+1}" fill="rgba(255,255,255,0.15)" font-family="IBM Plex Mono,monospace" font-size="9">${v}</text>`;
  }).join('');

  const spokes = Array.from({length:n}, (_,i) => {
    const [x,y] = pt(i,1);
    return `<line class="r-grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
  }).join('');

  const dataPts = axes.map((a,i) => pt(i, Math.min(a.v,1)).join(',')).join(' ');

  const dots = axes.map((a,i) => {
    const [x,y] = pt(i, Math.min(a.v,1));
    return `<circle class="r-dot" style="animation-delay:${0.3+i*0.05}s" cx="${x}" cy="${y}" r="5.5" fill="${rc}" filter="url(#rGlow)"/>`;
  }).join('');

  const labels = axes.map((a,i) => {
    const [x,y] = pt(i, 1.28);
    const val = Math.round(a.v * 100);
    const an = anchor(i);
    const sn = Math.sin((Math.PI*2*i/n) - Math.PI/2);
    const dy = sn > 0.7 ? 16 : sn < -0.7 ? -6 : 0;
    return `<g class="r-lbl" style="animation-delay:${0.2+i*0.06}s">
      <text x="${x}" y="${y+dy-9}" text-anchor="${an}" fill="rgba(255,255,255,0.4)" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5">${a.l}</text>
      <text x="${x}" y="${y+dy+14}" text-anchor="${an}" fill="white" font-family="Bebas Neue,cursive" font-size="24">${val}</text>
    </g>`;
  }).join('');

  const scoreCenter = `
    <g class="r-lbl" style="animation-delay:0.5s">
      <circle cx="${cx}" cy="${cy}" r="32" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="white" font-family="Bebas Neue,cursive" font-size="42">${p.prospect_score}</text>
    </g>`;

  return `<svg viewBox="0 0 500 500" width="100%" style="overflow:visible;max-width:480px">
    <defs>
      <radialGradient id="rFill" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${rc}" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="${rc}" stop-opacity="0.03"/>
      </radialGradient>
      <filter id="rGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="rLineGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    ${rings}${spokes}${ringNums}
    <polygon class="r-poly" points="${dataPts}" fill="url(#rFill)" stroke="${rc}" stroke-width="2.5" stroke-linejoin="round" filter="url(#rLineGlow)"/>
    ${dots}${labels}${scoreCenter}
  </svg>`;
}
let view = 'table';
let page = 1;
const PS = 30;
let currentIdx = -1;

// ── Watchlist (persisted in localStorage) ────────────────────────────────────
let watchlist = new Set(JSON.parse(localStorage.getItem('wl') || '[]'));
function pkey(p) { return p.name + '||' + p.team; }
function inWatch(p) { return watchlist.has(pkey(p)); }
function toggleWatch(p, e) {
  e.stopPropagation();
  if (inWatch(p)) watchlist.delete(pkey(p)); else watchlist.add(pkey(p));
  localStorage.setItem('wl', JSON.stringify([...watchlist]));
  // refresh whatever view is showing
  renderAll();
  // sync detail-panel star if open
  const ds = document.getElementById('dstar');
  if (ds.style.display !== 'none') { ds.className = inWatch(p) ? 'on' : ''; ds.textContent = inWatch(p) ? '★' : '☆'; }
}

function sc(p) {
  const s = p.prospect_score;
  return s >= 90 ? 'sm' : s >= 80 ? 'sh' : s >= 70 ? 'sy' : s >= 60 ? 'sl' : 'sr';
}
function lc(l) {
  const lvl = l.split(',')[0].trim();
  return lvl === 'AAA' ? 'lAAA' : lvl === 'AA' ? 'lAA' : lvl === 'A+' ? 'lAp' : lvl === 'A' ? 'lA' : 'lCPX';
}
function lvlShort(l) { return l.split(',')[0].trim(); }
function bar(val, color) {
  const p = Math.round(val * 100);
  return `<div class="bw"><div class="bar"><div class="bf" style="width:${p}%;background:${color}"></div></div><span class="bv" style="color:${color}">${p}</span></div>`;
}
function avgColor(v) { return v >= 0.325 ? 'var(--accent3)' : v <= 0.230 ? 'var(--red)' : ''; }
function obpColor(v) { return v >= 0.400 ? 'var(--accent3)' : v <= 0.300 ? 'var(--red)' : ''; }
function slgColor(v) { return v >= 0.550 ? 'var(--accent3)' : v <= 0.350 ? 'var(--red)' : ''; }
function opsColor(v)  { return v >= 0.950 ? 'var(--accent3)' : v <= 0.650 ? 'var(--red)' : ''; }
function isoColor(v)  { return v >= 0.220 ? 'var(--accent3)' : v <= 0.120 ? 'var(--red)' : ''; }
function wobaColor(v) { return v >= 0.425 ? 'var(--accent3)' : v <= 0.290 ? 'var(--red)' : ''; }
function wrcColor(v)  { return v >= 160   ? 'var(--accent3)' : v <= 80    ? 'var(--red)' : ''; }
function bbColor(v)   { return v >= 15    ? 'var(--accent3)' : ''; }
function kColor(v)    { return v <= 15    ? 'var(--accent3)' : v >= 28    ? 'var(--red)' : ''; }
function valColor(v)  { return v >= 70 ? '#39ff88' : v < 40 ? 'var(--red)' : ''; }
function shortSet(s) {
  if (!s) return '';
  const year  = (s.match(/\b(20\d{2})\b/) || [])[1] || '';
  const draft  = /draft/i.test(s)  ? ' Draft'  : '';
  const chrome = /chrome/i.test(s) ? ' Chrome' : '';
  return (year + ' Bowman' + draft + chrome).trim();
}

function computeValueScores(players) {
  // Value score: prospect quality per $ of card price (normalized 0-100)
  // High score = high prospect score relative to price = undervalued
  const priced = players.filter(p => p.prospect_score != null && p.price_raw != null && p.price_raw > 0);
  if (!priced.length) return;
  const raws = priced.map(p => p.prospect_score / Math.log10(p.price_raw + 1));
  const min = Math.min(...raws), max = Math.max(...raws);
  const range = max - min || 1;
  priced.forEach((p, i) => { p._val = Math.round((raws[i] - min) / range * 100); });
}

let showTrends = false;
function toggleTrends() {
  showTrends = !showTrends;
  document.getElementById('btn-trends').classList.toggle('active', showTrends);
  renderAll();
}

// Always-on trend arrow — used in detail card
function trend(d, lb) {
  if (d == null) return '';
  if (d === 0)   return '<span class="tr-neu">—</span>';
  return (lb ? d < 0 : d > 0)
    ? '<span class="tr-up">▲</span>'
    : '<span class="tr-dn">▼</span>';
}
// Table-only trend arrow — respects the toggle
function tbl(d, lb) { return showTrends ? trend(d, lb) : ''; }

// Null-safe formatters — return '—' when the value is missing
function d3(v)  { return v != null ? v.toFixed(3) : '—'; }
function d2(v)  { return v != null ? v.toFixed(2) : '—'; }
function d1p(v) { return v != null ? v.toFixed(1) + '%' : '—'; }
function d0p(v) { return v != null ? parseFloat(v).toFixed(0) + '%' : '—'; }
function dltw(v){ return v != null ? v.toLocaleString() : '—'; }

function applyF() {
  const q = document.getElementById('search').value.toLowerCase();
  const team = document.getElementById('ft').value;
  const lvl = document.getElementById('fl').value;
  const maxAge = document.getElementById('fa').value ? parseInt(document.getElementById('fa').value) : null;
  const minAB = document.getElementById('fab').value ? parseInt(document.getElementById('fab').value) : null;

  filtered = RAW.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    if (team && p.team !== team) return false;
    if (lvl) {
      if (lvl === 'CPX' && !p.level.includes('CPX') && !p.level.includes('ROK')) return false;
      else if (lvl !== 'CPX' && lvl === 'A' && p.level !== 'A') return false;
      else if (lvl !== 'CPX' && lvl !== 'A' && !p.level.includes(lvl)) return false;
    }
    if (maxAge && p.age > maxAge) return false;
    if (minAB && p.ab < minAB) return false;
    return true;
  });
  // Profile filters (applied after standard filters)
  if (activeProfile === 'power') {
    filtered = filtered.filter(p =>
      (p.ab  ?? 0) >= 50  &&
      (p.iso ?? 0) >  0.220 &&
      (p.k   ?? 0) <  28  &&
      (p.ld  ?? 0) >  20  &&
      (p.wrc ?? 0) >  120
    );
  } else if (activeProfile === 'contact') {
    filtered = filtered.filter(p =>
      (p.ab  ?? 0) >= 50  &&
      (p.hit ?? 0) >  0.75 &&
      (p.avg ?? 0) >  0.270 &&
      (p.k   ?? 0) <  18  &&
      (p.ld  ?? 0) >  20  &&
      (p.wrc ?? 0) >  120
    );
  }
  // Risers: only players with a positive MoM score delta and min 50 AB
  if (sortF === 'prospect_score_d' && !activeFallers) {
    filtered = filtered.filter(p => (p.prospect_score_d ?? 0) >= 1 && (p.ab ?? 0) >= 50);
  }
  // Fallers: only players with a negative MoM score delta and min 50 AB
  if (activeFallers) {
    filtered = filtered.filter(p => (p.prospect_score_d ?? 0) <= -1 && (p.ab ?? 0) >= 50);
  }
  // Value: undervalued prospects — sort by value score, players without price data fall to bottom
  if (activeValue) {
    filtered = filtered.filter(p => p._val != null);
  }
  sortData();
  page = 1;
  updateSummary();
  renderAll();
}

function sortData() {
  const fn = {
    ltw: p => p.ltw, prospect_score: p => p.prospect_score,
    ops: p => p.ops, avg: p => p.avg, wrc: p => p.wrc,
    hr: p => p.hr, sb2: p => p.sb, woba: p => p.woba,
    name: p => p.name,
    hit: p => p.hit, pwr: p => p.pwr, spd: p => p.spd,
    dis: p => p.dis, age_r: p => p.age_r ?? 0, wrc_r: p => p.wrc_r,
    prospect_score_d: p => p.prospect_score_d ?? 0,
    ld: p => p.ld ?? 0,
    val: p => p._val ?? 0,
    price_raw: p => p.price_raw ?? 0,
    price_psa10: p => p.price_psa10 ?? 0,
    age: p => p.age, ab: p => p.ab, iso: p => p.iso,
    obp: p => p.obp, slg: p => p.slg, bb: p => p.bb, k: p => p.k,
    swstr: p => p.swstr ?? 0
  }[sortF] || (p => p.ltw);
  filtered.sort((a,b) => {
    const va = fn(a), vb = fn(b);
    if (typeof va === 'string') return va.localeCompare(vb) * sortD;
    return (vb - va) * (sortD < 0 ? 1 : -1);
  });
}

function quickFilter(type) {
  const lvl = document.getElementById('fl').value;
  const age = document.getElementById('fa').value;
  switch(type) {
    case 'top25':
      sortF = sortF==='prospect_score' ? 'ltw' : 'prospect_score';
      sortD = -1; document.getElementById('sb').value = sortF; applyF(); break;
    case 'risers': {
      const wasRisers = sortF==='prospect_score_d' && !activeFallers;
      activeFallers = false;
      sortF = wasRisers ? 'ltw' : 'prospect_score_d';
      sortD = -1; applyF(); break;
    }
    case 'fallers':
      if (activeFallers) {
        activeFallers = false; sortF = 'ltw'; sortD = -1;
      } else {
        activeFallers = true; sortF = 'prospect_score_d'; sortD = 1;
      }
      applyF(); break;
    case 'value':
      activeValue = !activeValue;
      if (activeValue) { sortF = 'val'; sortD = -1; } else { sortF = 'ltw'; }
      applyF(); break;
    case 'power':
      activeProfile = activeProfile==='power' ? null : 'power'; applyF(); break;
    case 'contact':
      activeProfile = activeProfile==='contact' ? null : 'contact'; applyF(); break;
    case 'age20':
      document.getElementById('fa').value = age==='20' ? '' : '20'; applyF(); break;
    case 'watch':
      setView(view==='watch' ? 'table' : 'watch'); break;
  }
}

function updateSummary() {
  // ── Market snapshot → header-right ───────────────────────────────────────
  const priced   = RAW.filter(p => p.price_raw  != null);
  const psa10d   = RAW.filter(p => p.price_psa10 != null);
  const wlPriced = RAW.filter(p => inWatch(p) && p.price_raw != null);
  const avgRaw   = priced.length   ? priced.reduce((s,p)=>s+p.price_raw,0)   / priced.length   : null;
  const avgPsa10 = psa10d.length   ? psa10d.reduce((s,p)=>s+p.price_psa10,0) / psa10d.length   : null;
  const wlVal    = wlPriced.reduce((s,p)=>s+p.price_raw, 0);
  const fmt = v => '$' + v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  document.getElementById('header-right').innerHTML = [
    avgRaw   != null ? `<div class="stat-pill">Avg Raw <span>${fmt(avgRaw)}</span></div>`   : '',
    avgPsa10 != null ? `<div class="stat-pill">Avg PSA10 <span style="color:var(--accent)">${fmt(avgPsa10)}</span></div>` : '',
    wlPriced.length  ? `<div class="stat-pill">★ Est. Value <span style="color:var(--gold)">${fmt(wlVal)}</span></div>` : '',
  ].join('');

  // ── Quick filter chips → sumbar ───────────────────────────────────────────
  const lvl = document.getElementById('fl').value;
  const age = document.getElementById('fa').value;
  const chips = [
    { l:'Risers ▲',  type:'risers',  on: sortF==='prospect_score_d' && !activeFallers },
    { l:'Fallers ▼', type:'fallers', on: activeFallers },
    { l:'Value',     type:'value',   on: activeValue },
    { l:'Power',     type:'power',   on: activeProfile==='power' },
    { l:'Contact',   type:'contact', on: activeProfile==='contact' },
  ];
  document.getElementById('sumbar').innerHTML =
    `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 0 10px">
      ${chips.map(c=>`<button class="chip${c.on?' on':''}" onclick="quickFilter('${c.type}')">${c.l}</button>`).join('')}
    </div>`;
}

function getPage() { return filtered.slice((page-1)*PS, page*PS); }

function renderAll() {

      <td class="${cls}" style="font-weight:600">${p.prospect_score}${sortF==='prospect_score_d'&&p.prospect_score_d!=null?activeFallers?`<span style="color:#ff4444;font-size:9px;margin-left:4px;font-weight:700">${Math.round(p.prospect_score_d)}</span>`:`<span style="color:#39ff88;font-size:9px;margin-left:4px;font-weight:700">+${Math.round(p.prospect_score_d)}</span>`:tbl(p.prospect_score_d)}</td>

      <td style="${avgColor(p.avg)?`color:${avgColor(p.avg)};font-weight:600`:''}">${d3(p.avg)}${tbl(p.avg_d)}</td>

      <td style="${opsColor(p.ops)?`color:${opsColor(p.ops)};font-weight:600`:''}">${d3(p.ops)}${tbl(p.ops_d)}</td>
      <td style="${isoColor(p.iso)?`color:${isoColor(p.iso)};font-weight:600`:''}">${d3(p.iso)}${tbl(p.iso_d)}</td>

function renderPg() {
  const total = filtered.length;
  const pages = Math.ceil(total / PS);
  const pg = document.getElementById('pg');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  let h = `<button class="pb" onclick="goP(${page-1})" ${page===1?'disabled':''}>‹ Prev</button>`;
  let start = Math.max(1, page-3), end = Math.min(pages, page+3);
  if (start > 1) h += `<button class="pb" onclick="goP(1)">1</button>${start>2?'<span class="pi">…</span>':''}`;
  for (let i=start;i<=end;i++) h += `<button class="pb ${i===page?'active':''}" onclick="goP(${i})">${i}</button>`;
  if (end < pages) h += `${end<pages-1?'<span class="pi">…</span>':''}<button class="pb" onclick="goP(${pages})">${pages}</button>`;
  h += `<button class="pb" onclick="goP(${page+1})" ${page===pages?'disabled':''}>Next ›</button>`;
  h += `<span class="pi">${((page-1)*PS)+1}–${Math.min(page*PS,total)} of ${total.toLocaleString()}</span>`;
  pg.innerHTML = h;
}

function goP(p) {
  const pages = Math.ceil(filtered.length / PS);
  if (p<1||p>pages) return;
  page = p;
  renderAll();
  window.scrollTo(0,0);
}

function sortBy(f) {
  if (sortF===f) sortD*=-1; else { sortF=f; sortD=-1; }
  document.getElementById('sb').value = f;
  applyF();
}

function closeDov(e) { if(e.target===document.getElementById('dov')) closeD(); }
function closeD() { document.getElementById('dov').classList.remove('open'); document.getElementById('dscore').style.display='none'; document.getElementById('dstar').style.display='none'; }

function setView(v) {
  view=v;
  ['table','cards','watch'].forEach(n => document.getElementById('btn-'+n).classList.toggle('active',v===n));
  document.getElementById('tv').style.display=v==='table'?'':'none';
  document.getElementById('cv').style.display=v==='cards'?'':'none';
  document.getElementById('wv').style.display=v==='watch'?'':'none';
  renderAll();
}

document.getElementById('search').addEventListener('input', applyF);
document.getElementById('ft').addEventListener('change', applyF);
document.getElementById('fl').addEventListener('change', applyF);
document.getElementById('fa').addEventListener('change', applyF);
document.getElementById('fab').addEventListener('change', applyF);
document.getElementById('sb').addEventListener('change', e => { sortF=e.target.value; applyF(); });

async function init() {
  try {
    const res = await fetch('prospects.json?v=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    RAW = await res.json();
  } catch(e) {
    document.getElementById('tbl').innerHTML =
      `<tr><td colspan="24" style="padding:40px;text-align:center;color:var(--red);font-family:'IBM Plex Mono',monospace">
        Failed to load prospects.json — ${e}<br><small style="color:var(--text-dim)">Make sure the file is served alongside the HTML (not opened as file://)</small>
      </td></tr>`;
    return;
  }
  computeValueScores(RAW);
  filtered = [...RAW];
  sortData();
  updateSummary();
  renderAll();
}
init();
</script>
